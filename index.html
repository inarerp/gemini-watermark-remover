<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إزالة علامة جيمناي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        .box {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 12px;
            margin: 10px 5px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        button {
            background: #4fc3f7;
            color: #000;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        #log {
            background: #0f0f1e;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
        }
        .param {
            margin: 10px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #4fc3f7;
        }
        input[type="number"] {
            width: 100px;
            background: #0f3460;
            color: white;
            border: 1px solid #4fc3f7;
        }
    </style>
</head>
<body>
    <h1>🎬 إزالة علامة جيمناي (FFmpeg.wasm)</h1>
    
    <div class="box">
        <h3>1️⃣ رفع الفيديو</h3>
        <input type="file" id="videoInput" accept="video/*">
        <div id="videoInfo" style="margin-top:10px; color:#aaa;"></div>
    </div>

    <div class="box">
        <h3>2️ منطقة علامة جيمناي (أسفل يمين)</h3>
        <div class="param">
            <label>المسافة من اليسار (x):</label>
            <input type="number" id="x" value="640" min="0">
            <span style="color:#aaa">بكسل</span>
        </div>
        <div class="param">
            <label>المسافة من الأعلى (y):</label>
            <input type="number" id="y" value="1200" min="0">
            <span style="color:#aaa">بكسل</span>
        </div>
        <div class="param">
            <label>عرض المنطقة (w):</label>
            <input type="number" id="w" value="60" min="10">
            <span style="color:#aaa">بكسل</span>
        </div>
        <div class="param">
            <label>ارتفاع المنطقة (h):</label>
            <input type="number" id="h" value="60" min="10">
            <span style="color:#aaa">بكسل</span>
        </div>
        <button id="processBtn" onclick="processVideo()">🚀 إزالة العلامة</button>
    </div>

    <div class="box">
        <h3>3️⃣ النتيجة</h3>
        <video id="outputVideo" controls style="display:none;"></video>
        <div id="downloadLink" style="margin-top:10px;"></div>
    </div>

    <div class="box">
        <h3>📝 السجل</h3>
        <div id="log">جاهز للعمل...</div>
    </div>

    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { fetchFile } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        const ffmpeg = new FFmpeg();
        let videoFile = null;

        // تحميل FFmpeg
        async function loadFFmpeg() {
            log('⏳ جاري تحميل FFmpeg.wasm...');
            try {
                await ffmpeg.load({
                    coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js'
                });
                log('✅ تم تحميل FFmpeg.wasm');
            } catch (err) {
                log('❌ خطأ في تحميل FFmpeg: ' + err.message);
            }
        }

        // تحميل الفيديو
        document.getElementById('videoInput').addEventListener('change', (e) => {
            videoFile = e.target.files[0];
            if (videoFile) {
                const url = URL.createObjectURL(videoFile);
                const video = document.createElement('video');
                video.src = url;
                video.onloadedmetadata = () => {
                    document.getElementById('videoInfo').innerHTML = 
                        `📹 الدقة: ${video.videoWidth}×${video.videoHeight} | المدة: ${video.duration.toFixed(1)} ثانية`;
                    
                    // تحديث القيم الافتراضية بناءً على دقة الفيديو
                    if (video.videoWidth === 720 && video.videoHeight === 1280) {
                        document.getElementById('x').value = 640;
                        document.getElementById('y').value = 1200;
                        document.getElementById('w').value = 60;
                        document.getElementById('h').value = 60;
                    } else if (video.videoWidth === 1080 && video.videoHeight === 1920) {
                        document.getElementById('x').value = 960;
                        document.getElementById('y').value = 1800;
                        document.getElementById('w').value = 90;
                        document.getElementById('h').value = 90;
                    }
                };
            }
        });

        // معالجة الفيديو
        window.processVideo = async function() {
            if (!videoFile) {
                log('❌ ارفع فيديو أولاً!');
                return;
            }

            const x = parseInt(document.getElementById('x').value);
            const y = parseInt(document.getElementById('y').value);
            const w = parseInt(document.getElementById('w').value);
            const h = parseInt(document.getElementById('h').value);

            document.getElementById('processBtn').disabled = true;
            log(' جاري المعالجة... (قد يستغرق عدة دقائق للفيديوهات الطويلة)');

            try {
                // كتابة الفيديو
                await ffmpeg.writeFile('input.mp4', await fetchFile(videoFile));
                log('📤 تم رفع الفيديو');

                // استخدام delogo filter
                const command = [
                    '-i', 'input.mp4',
                    '-vf', `delogo=x=${x}:y=${y}:w=${w}:h=${h}:show=0`,
                    '-c:a', 'copy',
                    'output.mp4'
                ];

                log('🎯 جاري إزالة العلامة...');
                await ffmpeg.exec(command);
                log('✅ انتهت المعالجة!');

                // قراءة النتيجة
                const data = await ffmpeg.readFile('output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                // عرض الفيديو
                const video = document.getElementById('outputVideo');
                video.src = url;
                video.style.display = 'block';

                // رابط التنزيل
                document.getElementById('downloadLink').innerHTML = 
                    `<a href="${url}" download="video_no_logo.mp4" style="color:#4fc3f7; font-size:18px;">💾 تنزيل الفيديو</a>`;

                // تنظيف
                await ffmpeg.deleteFile('input.mp4');
                await ffmpeg.deleteFile('output.mp4');

            } catch (err) {
                log(' خطأ: ' + err.message);
                console.error(err);
            }

            document.getElementById('processBtn').disabled = false;
        };

        function log(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // تحميل FFmpeg عند فتح الصفحة
        loadFFmpeg();
    </script>
</body>
</html>
