<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغطية علامة جيمناي</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a2e; color: white; text-align: center; }
        .box { background: #16213e; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        video { max-width: 100%; border-radius: 8px; background: #000; }
        button { padding: 12px 24px; background: #4fc3f7; color: #000; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #log { background: #0f0f1e; padding: 15px; border-radius: 5px; font-family: monospace; margin-top: 10px; text-align: right; }
        input[type="file"] { margin: 10px 0; }
    </style>
</head>
<body>
    <h1> تغطية علامة جيمناي (الحل المضمون)</h1>
    
    <div class="box">
        <h3>1️⃣ ارفع الفيديو</h3>
        <input type="file" id="videoInput" accept="video/*">
    </div>

    <div class="box">
        <h3>2️⃣ المعاينة والتغطية</h3>
        <video id="previewVideo" controls></video>
        <br>
        <button onclick="toggleCover()">👁️ إظهار/إخفاء التغطية</button>
        <p style="font-size:12px; color:#aaa;">التغطية هتتحط تلقائياً في أسفل يمين الفيديو (مكان علامة جيمناي)</p>
    </div>

    <div class="box">
        <h3>3️⃣ التصدير</h3>
        <button id="exportBtn" onclick="exportVideo()" disabled>🚀 بدء التصدير (قد يستغرق وقتاً)</button>
        <div id="progress" style="margin-top:10px; font-weight:bold; color:#4fc3f7;"></div>
    </div>

    <div id="log">جاهز...</div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const previewVideo = document.getElementById('previewVideo');
        const exportBtn = document.getElementById('exportBtn');
        const progressDiv = document.getElementById('progress');
        const logDiv = document.getElementById('log');
        
        let videoFile = null;
        let showCover = true;

        // 1. تحميل الفيديو
        videoInput.addEventListener('change', (e) => {
            videoFile = e.target.files[0];
            if (videoFile) {
                const url = URL.createObjectURL(videoFile);
                previewVideo.src = url;
                exportBtn.disabled = false;
                log('✅ تم تحميل الفيديو: ' + videoFile.name);
            }
        });

        // 2. تشغيل/إيقاف التغطية (للمعاينة)
        function toggleCover() {
            showCover = !showCover;
            log(showCover ? '✅ التغطية ظاهرة' : '️ التغطية مخفية');
        }

        // 3. التصدير (الجزء السحري)
        async function exportVideo() {
            if (!videoFile) return;
            
            exportBtn.disabled = true;
            progressDiv.textContent = '⏳ جاري المعالجة... (لا تغلق الصفحة)';
            log('🎬 بدء التسجيل...');

            // إنشاء Canvas بنفس حجم الفيديو
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // انتظار تحميل أبعاد الفيديو
            await new Promise(r => {
                previewVideo.onloadedmetadata = () => {
                    canvas.width = previewVideo.videoWidth;
                    canvas.height = previewVideo.videoHeight;
                    r();
                };
            });

            // إعداد التسجيل
            const stream = canvas.captureStream(30); // 30 FPS
            // محاولة إضافة الصوت
            try {
                const audioStream = previewVideo.captureStream();
                audioStream.getAudioTracks().forEach(track => stream.addTrack(track));
            } catch(e) { log('⚠️ تحذير: الصوت قد لا يعمل في بعض المتصفحات'); }

            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];
            
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'video_covered.webm';
                a.click();
                log('✅ تم التصدير بنجاح!');
                progressDiv.textContent = '';
                exportBtn.disabled = false;
            };

            // بدء التشغيل والتسجيل
            previewVideo.currentTime = 0;
            await new Promise(r => previewVideo.onseeked = r);
            
            mediaRecorder.start();
            previewVideo.play();

            // رسم كل فريم
            function drawFrame() {
                if (previewVideo.ended || previewVideo.paused) {
                    mediaRecorder.stop();
                    previewVideo.pause();
                    return;
                }

                // مسح الكانفاس
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // رسم الفيديو
                ctx.drawImage(previewVideo, 0, 0, canvas.width, canvas.height);

                // رسم التغطية (مربع أسود أو لوجو)
                if (showCover) {
                    // مكان العلامة (تقريباً أسفل يمين الفيديو)
                    const w = canvas.width * 0.1; // 10% من العرض
                    const h = canvas.height * 0.05; // 5% من الارتفاع
                    const x = canvas.width - w - 20; // هامش 20 بكسل
                    const y = canvas.height - h - 20;

                    // رسم مربع أسود (أو ممكن تحط صورة لوجو مكانه)
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; // أسود شفاف
                    ctx.fillRect(x, y, w, h);
                    
                    // أو كتابة نص
                    ctx.fillStyle = 'white';
                    ctx.font = '20px Arial';
                    ctx.fillText('My Logo', x + 10, y + 30);
                }

                requestAnimationFrame(drawFrame);
            }

            drawFrame();
            log('🔄 جاري المعالجة...');
        }

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
